services:
  postgres-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: ${TASKORA_TEST_ADMIN_DB:?Test database config is required}
      POSTGRES_USER: ${TASKORA_TEST_ADMIN_USER:?Test database config is required}
      POSTGRES_PASSWORD: ${TASKORA_TEST_ADMIN_PASSWORD:?Test database config is required}
      TASKORA_TEST_DB_NAME: ${TASKORA_TEST_DB_NAME:?Test database config is required}
      TASKORA_TEST_DB_USER: ${TASKORA_TEST_DB_USER:?Test database config is required}
      TASKORA_TEST_DB_PASSWORD: ${TASKORA_TEST_DB_PASSWORD:?Test database config is required}
    ports:
      - "127.0.0.1:${TASKORA_TEST_DB_PORT:?Test database config is required}:5432"
    volumes:
      - taskora_test_postgres_data:/var/lib/postgresql/data
      - ./scripts/test-postgres-init.sh:/docker-entrypoint-initdb.d/10-create-taskora-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  taskora_test_postgres_data:
